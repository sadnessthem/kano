<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hair" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8B6B9F"/>
      <stop offset="100%" stop-color="#6B4F7F"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="100%" stop-color="#FDDCB8"/>
    </linearGradient>
    <linearGradient id="eyeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B3A7A"/>
      <stop offset="100%" stop-color="#3D2460"/>
    </linearGradient>
    <linearGradient id="eyeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B3A7A"/>
      <stop offset="100%" stop-color="#3D2460"/>
    </linearGradient>
    <linearGradient id="dress" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#E87EA0"/>
      <stop offset="100%" stop-color="#D4607F"/>
    </linearGradient>
  </defs>

  <!-- 阴影 -->
  <ellipse cx="32" cy="62" rx="16" ry="3" fill="rgba(0,0,0,0.10)"/>

  <!-- 头发（后层） -->
  <path d="M18 24 Q16 12 24 8 Q28 6 32 6 Q36 6 40 8 Q48 12 46 24
           Q48 36 46 42 Q44 48 40 50 Q36 52 32 52 Q28 52 24 50
           Q20 48 18 42 Q16 36 18 24 Z" fill="url(#hair)"/>

  <!-- 头发刘海 -->
  <path d="M20 22 Q22 14 28 12 Q30 18 32 18 Q34 18 36 12 Q42 14 44 22
           Q40 26 32 26 Q24 26 20 22 Z" fill="#7B5B8F"/>

  <!-- 脸 -->
  <ellipse cx="32" cy="30" rx="14" ry="13" fill="url(#skin)"/>

  <!-- 左眼 -->
  <ellipse cx="26.5" cy="29" rx="3.2" ry="3.8" fill="#fff"/>
  <ellipse cx="26.5" cy="29.5" rx="2.4" ry="2.8" fill="url(#eyeL)"/>
  <ellipse cx="27.5" cy="28" rx="0.9" ry="0.9" fill="#fff" opacity="0.8"/>

  <!-- 右眼 -->
  <ellipse cx="37.5" cy="29" rx="3.2" ry="3.8" fill="#fff"/>
  <ellipse cx="37.5" cy="29.5" rx="2.4" ry="2.8" fill="url(#eyeR)"/>
  <ellipse cx="38.5" cy="28" rx="0.9" ry="0.9" fill="#fff" opacity="0.8"/>

  <!-- 腮红 -->
  <ellipse cx="22" cy="34" rx="3" ry="1.8" fill="#FFB5B5" opacity="0.45"/>
  <ellipse cx="42" cy="34" rx="3" ry="1.8" fill="#FFB5B5" opacity="0.45"/>

  <!-- 嘴巴（微笑） -->
  <path d="M29 35 Q32 38.5 35 35" fill="none" stroke="#D4607F" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 身体/裙子 -->
  <path d="M22 42 Q20 44 18 48 Q16 52 14 56 L50 56 Q48 52 46 48 Q44 44 42 42 Z" fill="url(#dress)"/>

  <!-- 衣领 -->
  <path d="M29 42 L32 46 L35 42" fill="none" stroke="#C05070" stroke-width="1" stroke-linecap="round"/>

  <!-- 左手 -->
  <ellipse cx="18" cy="44" rx="3" ry="2" fill="url(#skin)" transform="rotate(-20, 18, 44)"/>

  <!-- 右手 -->
  <ellipse cx="46" cy="44" rx="3" ry="2" fill="url(#skin)" transform="rotate(20, 46, 44)"/>
</svg>
